<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Wax Seal</title>
<!--
  Wax seal artwork, 600x600 on a transparent background.
  Rendered to src/assets/seal-wine.png (default) and seal-gold.png (#gold).
  The seal is lit with SVG lighting filters: the alpha channel of #height is the
  relief (raised rim, sunken field, raised monogram), so the shading is physical
  rather than painted on.
-->
<style>
@font-face{font-family:Amiri;font-weight:700;src:url("../node_modules/@fontsource/amiri/files/amiri-arabic-700-normal.woff2") format("woff2")}
*{margin:0;padding:0}
html,body{width:600px;height:600px;background:transparent;overflow:hidden}
svg{display:block}
</style>
</head>
<body>
<svg width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="wax" x="0" y="0" width="600" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <!-- Solid silhouette of the seal -->
      <feComponentTransfer in="SourceAlpha" result="solid"><feFuncA type="linear" slope="30"/></feComponentTransfer>
      <!-- Relief map -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.6" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="6.5" diffuseConstant="1" lighting-color="#ffffff" result="diffuse">
        <feDistantLight id="light-d" azimuth="235" elevation="52"/>
      </feDiffuseLighting>
      <feSpecularLighting in="bump" surfaceScale="6.5" specularConstant=".42" specularExponent="24" id="spec-l" lighting-color="#ffdfe5" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <!-- Wax colour, shaded -->
      <feFlood id="wax-colour" flood-color="#6A1B2A" result="colour"/>
      <feComposite id="shade" in="colour" in2="diffuse" operator="arithmetic" k1="1.12" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="spec" in2="solid" operator="in" result="specIn"/>
      <feComposite in="lit" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="shine"/>
      <feComposite in="shine" in2="solid" operator="in"/>
    </filter>
  </defs>

  <g filter="url(#wax)">
    <g id="height"></g>
  </g>
</svg>

<script>
const gold = location.hash === '#gold';
if (gold) {
  document.getElementById('wax-colour').setAttribute('flood-color', '#A9843F');
  document.getElementById('shade').setAttribute('k1', '1.08');
  const spec = document.getElementById('spec-l');
  spec.setAttribute('lighting-color', '#fff0c8');
  spec.setAttribute('specularConstant', '.62');
}

const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
};

/* Organic puddle outline: a circle with low-frequency wobble and two soft drips,
   smoothed through Catmull-Rom so the edge never looks torn. */
const C = 300, N = 72;
const bump = (t, at, amp, w) => amp * Math.exp(-(((t - at + Math.PI * 3) % (Math.PI * 2) - Math.PI) ** 2) / (2 * w * w));
const pts = Array.from({ length: N }, (_, i) => {
  const t = (i / N) * Math.PI * 2;
  const r = 236
    + 6 * Math.sin(3 * t + 0.4) + 4 * Math.sin(5 * t + 1.3) + 2.2 * Math.sin(9 * t + 2.1)
    + bump(t, 0.85, 13, 0.22) + bump(t, 3.95, 10, 0.2) + bump(t, 5.4, 6, 0.16);
  return [C + r * Math.cos(t), C + r * Math.sin(t)];
});
let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
for (let i = 0; i < N; i++) {
  const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
  const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
  const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
  d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
}

const h = document.getElementById('height');
const R = 172; // radius of the pressed field

// Puddle surface (with the pressed field cut out), then the sunken field
el(h, 'path', { d: `${d}Z M${C - R} ${C}a${R} ${R} 0 1 0 ${R * 2} 0a${R} ${R} 0 1 0 ${-R * 2} 0Z`, 'fill-rule': 'evenodd', fill: '#000', 'fill-opacity': .6 });
el(h, 'circle', { cx: C, cy: C, r: R, fill: '#000', 'fill-opacity': .34 });

// Ridge of wax pushed up around the stamp
el(h, 'circle', { cx: C, cy: C, r: R + 7, fill: 'none', stroke: '#000', 'stroke-width': 16, 'stroke-opacity': .95 });

// Engraved detail of the stamp face: a ring of fine beads
for (let i = 0; i < 44; i++) {
  const a = (i / 44) * Math.PI * 2;
  el(h, 'circle', { cx: C + (R - 24) * Math.cos(a), cy: C + (R - 24) * Math.sin(a), r: 2.8, fill: '#000', 'fill-opacity': .7 });
}

// Monogram: ي (Yousef) on the right, م (Malak) on the left, a small eight-pointed star between
const letters = el(h, 'g', { fill: '#000', 'fill-opacity': .9, 'font-family': 'Amiri', 'font-weight': 700, 'font-size': 150, 'text-anchor': 'middle' });
el(letters, 'text', { x: C + 66, y: C + 22 }).textContent = 'ي';
el(letters, 'text', { x: C - 64, y: C + 22 }).textContent = 'م';
const star = Array.from({ length: 16 }, (_, i) => {
  const a = (i * 22.5 - 90) * Math.PI / 180, r = i % 2 ? 12 : 21;
  return `${(C + r * Math.cos(a)).toFixed(2)},${(C - 6 + r * Math.sin(a)).toFixed(2)}`;
}).join(' ');
el(h, 'polygon', { points: star, fill: '#000', 'fill-opacity': .88 });
</script>
</body>
</html>
